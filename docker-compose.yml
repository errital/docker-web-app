services:

  frontend:
    image: errital/mon-frontend:latest
    ports:
      - "8080:80"

  backend:
    image: errital/mon-backend:latest
    ports:
      - "5000:5000"
    depends_on:
      - database

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: